{% extends "base.html" %}

{% set page_class = "page-auth" %}

{% block title %}Ingresar{% endblock %}

{% block content %}
<section class="card auth-card">
    <header class="auth-heading">
        <p class="eyebrow">Acceso</p>
        <h2>Ingresar</h2>
        <p class="hero-copy">Ingresa con tu usuario para acceder a la app.</p>
    </header>

    <form method="post" class="form-grid auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <label>
            <span>Usuario</span>
            <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
            <span>Contraseña</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button button-primary" type="submit">Ingresar</button>
    </form>
</section>
{% endblock %}
